[storage]
driver = "overlay"

# The Manager sets XDG_DATA_HOME to a path in the workspace volume.
# Podman follows this, placing image layers within the user's workspace instead
# of the dedicated volume mounted at /home/node/.local/share/containers.
# Hardcoding rootless_storage_path ensures images go to the correct volume.
rootless_storage_path = "/home/node/.local/share/containers/storage"

[storage.options.overlay]
mount_program = ""
ignore_chown_errors = "true"