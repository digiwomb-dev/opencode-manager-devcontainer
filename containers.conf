[engine]
cgroup_manager = "cgroupfs"
network_backend = "netavark"
events_logger = "file"

[containers]
# Podman's default includes net.ipv4.ping_group_range which is written on every start.
# In a single-UID mapped environment, this write fails with an invalid argument error.
# Setting this to an empty array prevents the issue, as dev containers CLI uses --userns=keep-id.
default_sysctls = []