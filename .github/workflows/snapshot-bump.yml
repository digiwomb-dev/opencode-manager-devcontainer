name: Bump Snapshot Timestamp

on:
  pull_request:
    paths:
      - 'Dockerfile'

jobs:
  bump-snapshot:
    if: github.actor == 'renovate[bot]' || github.actor == 'renovate'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update SNAPSHOT_TS
        run: |
          # The snapshot timestamp must always follow or match the time when Renovate bumped the pins.
          # Otherwise, the snapshot fallback would not contain the newly pinned versions, rendering it useless.
          # This step updates the timestamp to today's date if the Dockerfile was changed by Renovate.
          TODAY=$(date -u +%Y%m%dT000000Z)
          CURRENT_TS=$(awk -F= '/^ARG SNAPSHOT_TS=/ {print $2}' Dockerfile)
          
          if [ "$TODAY" != "$CURRENT_TS" ]; then
            sed -i "s/^ARG SNAPSHOT_TS=.*/ARG SNAPSHOT_TS=$TODAY/" Dockerfile
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add Dockerfile
            git commit -m "chore: bump SNAPSHOT_TS to $TODAY"
            git push
          else
            echo "Snapshot timestamp is already up to date ($TODAY)."
          fi
