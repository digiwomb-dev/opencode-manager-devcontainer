name: Build and Publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: digiwomb-dev/opencode-manager-devcontainer

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive snapshot timestamp from commit
        id: extract
        run: |
          # Derive the Debian snapshot timestamp from the commit date rather than
          # storing it in the Dockerfile. This guarantees the snapshot always
          # matches or follows the pinned package versions in the same commit,
          # including for Renovate bumps, without a bot rewriting the branch.
          TS=$(git show -s --format=%cd --date=format-local:%Y%m%dT%H%M%SZ HEAD)
          echo "ts=$TS" >> "$GITHUB_OUTPUT"
          echo "Using snapshot timestamp $TS"
        env:
          TZ: UTC

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            SNAPSHOT_TS=${{ steps.extract.outputs.ts }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Create Manifest List
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Derive image tags
        id: tag
        env:
          SHA: ${{ github.sha }}
        run: |
          # Derive the release line from the pinned base image tag so that a
          # Renovate base image bump also moves the tag we publish under,
          # instead of silently republishing an old version number.
          BASE=$(sed -n 's|^FROM .*/opencode-manager:\([^@[:space:]]*\).*|\1|p' Dockerfile)
          if [ -z "$BASE" ]; then
            echo "::error::Could not derive tag from base image in Dockerfile" >&2
            exit 1
          fi

          # The base version alone is not a unique identity for this image: this
          # repository adds its own package pins on top, so several different
          # builds can share one base version. Append the commit count, which is
          # strictly monotonic over the history and therefore unique per commit,
          # even across a rollback to a previously used base version. This yields
          # a tag that is never reused and can be pinned safely.
          BUILD=$(git rev-list --count HEAD)
          IMMUTABLE="${BASE}-b${BUILD}"

          {
            echo "base=$BASE"
            echo "immutable=$IMMUTABLE"
            echo "sha=sha-${SHA}"
          } >> "$GITHUB_OUTPUT"

          echo "Immutable: $IMMUTABLE / sha-${SHA}"
          echo "Moving:    $BASE, latest"

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Download digests
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Verify immutable tag is not taken by a different commit
        env:
          IMMUTABLE: ${{ steps.tag.outputs.immutable }}
          SHA_TAG: ${{ steps.tag.outputs.sha }}
        run: |
          # An immutable tag is only a guarantee if it never points at a
          # different commit's build. Every build also publishes a sha-<commit>
          # tag, so if the revision tag already exists we can tell the two cases
          # apart: pointing at the same content as this commit's sha tag means a
          # workflow re-run, which is safe to repeat. Anything else means the
          # revision number got reused by a different commit, which would break
          # whoever already pinned it.
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          existing=$(docker buildx imagetools inspect --raw "${IMAGE}:${IMMUTABLE}" 2>/dev/null \
            | sha256sum | cut -d' ' -f1) || existing=""
          if [ -z "$existing" ]; then
            echo "Tag ${IMMUTABLE} is free."
            exit 0
          fi
          mine=$(docker buildx imagetools inspect --raw "${IMAGE}:${SHA_TAG}" 2>/dev/null \
            | sha256sum | cut -d' ' -f1) || mine=""
          if [ -n "$mine" ] && [ "$existing" = "$mine" ]; then
            echo "Tag ${IMMUTABLE} already points at this commit's build; re-run is safe."
          else
            echo "::error::Tag ${IMMUTABLE} already exists for a different commit." >&2
            echo "::error::Refusing to overwrite an immutable tag. This usually means" >&2
            echo "::error::the history was rewritten, so the revision number repeated." >&2
            exit 1
          fi

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          BASE: ${{ steps.tag.outputs.base }}
          IMMUTABLE: ${{ steps.tag.outputs.immutable }}
          SHA_TAG: ${{ steps.tag.outputs.sha }}
        run: |
          # The first two tags are immutable and safe to pin; the last two are
          # moving pointers to the newest build of this release line.
          docker buildx imagetools create \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMMUTABLE}" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA_TAG}" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${BASE}" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Summarise published tags
        env:
          BASE: ${{ steps.tag.outputs.base }}
          IMMUTABLE: ${{ steps.tag.outputs.immutable }}
          SHA_TAG: ${{ steps.tag.outputs.sha }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          {
            echo "### Published tags"
            echo
            echo "| Tag | Stability |"
            echo "| --- | --- |"
            echo "| \`${IMAGE}:${IMMUTABLE}\` | immutable, safe to pin |"
            echo "| \`${IMAGE}:${SHA_TAG}\` | immutable, safe to pin |"
            echo "| \`${IMAGE}:${BASE}\` | moving |"
            echo "| \`${IMAGE}:latest\` | moving |"
          } >> "$GITHUB_STEP_SUMMARY"
