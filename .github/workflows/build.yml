name: Build and Publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: digiwomb-dev/opencode-manager-devcontainer

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      base: ${{ steps.v.outputs.base }}
      build: ${{ steps.v.outputs.build }}
      sha: ${{ steps.v.outputs.sha }}
      snapshot_ts: ${{ steps.v.outputs.snapshot_ts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve version and snapshot timestamp
        id: v
        env:
          SHA: ${{ github.sha }}
          TZ: UTC
        run: |
          # The version tracks the upstream opencode-manager release this image
          # is built on. That alone is not a unique identity, because this
          # repository adds its own package pins on top and so produces several
          # builds per upstream release, so append a build number.
          BASE=$(sed -n 's|^FROM .*/opencode-manager:\([^@[:space:]]*\).*|\1|p' Dockerfile)
          if [ -z "$BASE" ]; then
            echo "::error::Could not derive base image version from Dockerfile" >&2
            exit 1
          fi

          # The build number is the commit count: strictly monotonic over the
          # history, so it stays unique even if the upstream version rolls back
          # to one used earlier. It is kept purely numeric on purpose, because
          # semver compares numeric prerelease identifiers numerically while
          # alphanumeric ones compare as strings, which would sort -9 above -16.
          BUILD=$(git rev-list --count HEAD)
          VERSION="${BASE}-${BUILD}"

          # Derive the Debian snapshot timestamp from the commit date rather than
          # storing it in the Dockerfile. This guarantees the snapshot always
          # matches or follows the pinned package versions in the same commit,
          # including for Renovate bumps, without a bot rewriting the branch.
          TS=$(git show -s --format=%cd --date=format-local:%Y%m%dT%H%M%SZ HEAD)

          {
            echo "version=$VERSION"
            echo "base=$BASE"
            echo "build=$BUILD"
            echo "sha=sha-${SHA}"
            echo "snapshot_ts=$TS"
          } >> "$GITHUB_OUTPUT"

          echo "Immutable: $VERSION / sha-${SHA}"
          echo "Moving:    $BASE, latest"
          echo "Snapshot:  $TS"

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Runs on pull requests too, even though nothing is pushed there. Renovate
      # keeps these actions up to date, and an update that only executes after
      # merging is an update nothing tested. Pushing stays gated on the event
      # below, so exercising the login here publishes nothing.
      - name: Log in to the Container registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            SNAPSHOT_TS=${{ needs.version.outputs.snapshot_ts }}
            IMAGE_VERSION=${{ needs.version.outputs.version }}
            UPSTREAM_VERSION=${{ needs.version.outputs.base }}
            REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      # buildx exports a manifest and reports containerimage.digest even when
      # push is disabled, so this works unchanged on pull requests and lets the
      # artifact upload be exercised there as well.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "::error::build step reported no image digest" >&2
            exit 1
          fi
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Create Manifest List
    runs-on: ubuntu-24.04
    needs: [version, build]
    # Runs on pull requests as well, so the actions in this job are exercised
    # before an update to them is merged. Only the steps that publish or inspect
    # pushed images are gated on the event, so a pull request creates no tags.
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Verify the digests were transferred
        working-directory: /tmp/digests
        run: |
          # Confirms the upload/download artifact roundtrip produced one digest
          # file per architecture. This is the part of the job that is meaningful
          # on a pull request, where nothing has been pushed to the registry.
          count=$(ls -1 | wc -l)
          echo "digest files: $count"
          ls -1
          if [ "$count" -ne 2 ]; then
            echo "::error::Expected 2 digest files, got ${count}." >&2
            exit 1
          fi

      - name: Verify the built images are still present
        if: github.event_name != 'pull_request'
        working-directory: /tmp/digests
        run: |
          # The per-platform images are pushed by digest and carry no tag until
          # the manifest list below is created, so a concurrent cleanup can
          # delete them in between. Check them here to fail with a clear message
          # instead of an opaque "not found" from imagetools.
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          missing=0
          for d in *; do
            if docker buildx imagetools inspect --raw "${IMAGE}@sha256:${d}" >/dev/null 2>&1; then
              echo "present: ${d}"
            else
              echo "::error::Image ${d} is gone from the registry." >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Built images disappeared before they could be tagged." >&2
            echo "::error::A cleanup most likely ran concurrently. Re-run this build." >&2
            exit 1
          fi

      - name: Verify immutable tag is not taken by a different commit
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA_TAG: ${{ needs.version.outputs.sha }}
        run: |
          # An immutable tag is only a guarantee if it never points at a
          # different commit's build. Every build also publishes a sha-<commit>
          # tag, so if the version tag already exists we can tell the two cases
          # apart: pointing at the same content as this commit's sha tag means a
          # workflow re-run, which is safe to repeat. Anything else means the
          # patch number got reused by a different commit, which would break
          # whoever already pinned it.
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          existing=$(docker buildx imagetools inspect --raw "${IMAGE}:${VERSION}" 2>/dev/null \
            | sha256sum | cut -d' ' -f1) || existing=""
          if [ -z "$existing" ]; then
            echo "Tag ${VERSION} is free."
            exit 0
          fi
          mine=$(docker buildx imagetools inspect --raw "${IMAGE}:${SHA_TAG}" 2>/dev/null \
            | sha256sum | cut -d' ' -f1) || mine=""
          if [ -n "$mine" ] && [ "$existing" = "$mine" ]; then
            echo "Tag ${VERSION} already points at this commit's build; re-run is safe."
          else
            echo "::error::Tag ${VERSION} already exists for a different commit." >&2
            echo "::error::Refusing to overwrite an immutable tag. This usually means" >&2
            echo "::error::the history was rewritten, so the commit count repeated." >&2
            exit 1
          fi

      - name: Create manifest list and push
        if: github.event_name != 'pull_request'
        working-directory: /tmp/digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BASE: ${{ needs.version.outputs.base }}
          SHA_TAG: ${{ needs.version.outputs.sha }}
        run: |
          # The first two tags are immutable and safe to pin; the rest are
          # moving pointers to the newest build of their respective line.
          docker buildx imagetools create \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA_TAG}" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${BASE}" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Summarise published tags
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BASE: ${{ needs.version.outputs.base }}
          SHA_TAG: ${{ needs.version.outputs.sha }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          {
            echo "### Published tags"
            echo
            echo "| Tag | Stability |"
            echo "| --- | --- |"
            echo "| \`${IMAGE}:${VERSION}\` | immutable, safe to pin |"
            echo "| \`${IMAGE}:${SHA_TAG}\` | immutable, safe to pin |"
            echo "| \`${IMAGE}:${BASE}\` | moving, newest build for this upstream release |"
            echo "| \`${IMAGE}:latest\` | moving |"
          } >> "$GITHUB_STEP_SUMMARY"
