name: Automerge Renovate PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  automerge:
    # Keyed on the PR author rather than github.actor, because github.actor is
    # whoever triggered the event and so does not stay Renovate across reruns.
    if: github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Enable auto-merge for Renovate PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
